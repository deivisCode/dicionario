- termo: absorbancia
  acepcions:
    - lingua:
        gl:
          termo: absorbancia
          definicion: Parámetro que caracteriza a absorción de enerxía dunha determinada
            radiación ao atravesar un medio material transparente. Exprésase como
            o logaritmo decimal do inverso da transmitancia do devandito medio. Para
            o caso dunha disolución, a absorbancia depende directamente da molaridade
            da mesma, $M$, e da distancia percorrida ao seu través, $Delta x$, tal
            como indica a lei de Beer $ A = log phi_(e 0)/phi_e = epsilon dot M dot
            Delta x. $ A constante de proporcionalidade nesta expresión, $epsilon$
            , é o chamado coeficiente de extinción molar. Determinada a absorbancia
            da disolución por fotocolorimetría, e coñecido o espesor $Delta x$, así
            como o valor do coeficiente de extinción molar nesas condicións, pódese
            determinar a concentración desa disolución, resultando de gran utilidade
            na análise química. A absorbancia tamén recibe o nome de extinción.
          sinonimos:
            - extinción
          simbolo: ''
          clase: ''
          xenero: ''
          numero: ''
          forma: ''
          abreviacion: ''
          fontes:
            - Dicionario de Física Bahía
        es:
          termo: ''
          fontes:
            - Dicionario de Física Bahía
        en:
          termo: ''
          fontes:
            - Dicionario de Física Bahía
