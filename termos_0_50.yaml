- termo: actividade
  acepcions:
    - lingua:
        gl:
          termo: actividade
          definicion: En química, función termodinámica introducida por G.N. Lewis
            (1875-1946) que expresa a concentración dunha disolución non ideal. Relaciónase
            coa concentración da mesma disolución de comportamento ideal, $x$, do
            seguinte xeito $a= gamma x$; onde $gamma$ é o coeficiente de actividade,
            un parámetro de valor sempre inferior á unidade. En disolucións de non-electrolitos
            determínase a partir do potencial químico do compoñente $i$ na disolución
            nas condicións experimentais, $mu_i$, e o mesmo pero nun estado de referencia
            normal, $mu_i^0$, a través da expresión $a_i=exp((mu_i - mu_i^0)\/R T)$.
          sinonimos: []
          simbolo: ''
          clase: ''
          xenero: ''
          numero: ''
          forma: ''
          abreviacion: ''
          fontes:
            - Dicionario de Física Bahía
        es:
          termo: ''
          fontes:
            - Dicionario de Física Bahía
        en:
          termo: ''
          fontes:
            - Dicionario de Física Bahía
  relacionadas:
