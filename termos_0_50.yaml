          definicion: Nun sentido máis restrinxido, valor aproximado á aceleración
            con que caerían todos os corpos materiais no baleiro, para alturas próximas
            á superficie terrestre ou de calquera outro astro, debido á acción da
            gravidade. Na Terra, o seu valor varía coa latitude do lugar considerado,
            $lambda$, debido á rotación do planeta e a que este non é perfectamente
            esférico. Para o seu cálculo pódese empregar a ecuación $g_0 = 9.80622
            - 0.025930 cos(2 lambda) + 0.000028 cos(4 lambda)$ m · s⁻²; valor correxible
            segundo a altitude do lugar, $h$ (en m), mediante a ecuación $g =g_0 -
            3.086·10^(-6)h$, obténdose para un lugar situado a 150 m sobre o nivel
            do mar e 43º de latitude, o valor de 9.804391 m · s⁻². De todas formas,
            nas condicións habituais a aceleración con que cada corpo cae nun punto
            próximo á superficie terrestre non é o resultado exclusivo da gravidade,
            resultando decisiva a acción das forzas de rozamento co aire e, en moita
            menor medida, o empuxe do mesmo.
