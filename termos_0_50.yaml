          termo: acelerómetro
          definicion: 'Aparello que permite medir a aceleración dun móbil. Un exemplo
            sinxelo represéntase na figura adxunta (ver figura). O movemento acelerado
            cara a dereita do móbil vai provocar un desprazamento do péndulo cara
            a esquerda. Resolvendo o diagrama de forzas do sistema conclúese que o
            módulo da aceleración do móbil vén dado pola expresión $a = g tan(theta)$
            Polo tanto a observación directa do ángulo de desviación da vertical $theta$
            que experimenta o péndulo permite avaliar rapidamente a aceleración do
            carriño. Un dos acelerómetros máis sensibles que existen na natureza constitúeno
            os canais semicirculares do oído interno que nos informan dos cambios
            de velocidade que experimentamos. Son numerosos os estudios sobre a resposta
            do corpo humano ao someterse a aceleracións elevadas; neste sentido é
            moi común cuantificar a aceleración en forma de unidades $g$ dado que
            o ambiente habitual do ser humano é o de $1g$ ($approx 9.80$ ms⁻²). #figure(image("/figuras/acelerometro.svg"))'
