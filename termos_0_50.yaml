            $r$, que separa dous medios transparentes de distinto índice de refracción
            ($n$ e $n'$), cada un dos dous membros da igualdade $ n (1/r - 1/s) =
            n' (1/r - 1/(s')) $ onde $s$ e $s'$ son as respectivas distancias do obxecto
            e da súa imaxe, á superficie de separación. A ecuación cúmprese na aproximación
            paraxial. Para un espello esférico redúcese á ecuación máis sinxela $
            1/s + 1/(s') = 2/r. $
