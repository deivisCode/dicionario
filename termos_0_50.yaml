          termo: acoplamento
          definicion: 'Interacción entre dous sistemas ou partes dun mesmo sistema
            que leva a que determinadas magnitudes físicas, características dos mesmos,
            adopten determinados valores. Na teoría cuántica resultan de gran importancia
            os acoplamentos en átomos con varios electróns opticamente activos. Nunha
            primeira aproximación, a enerxía dos diferentes niveis enerxéticos, nun
            átomo, vén determinada polos números cuánticos n e l, aparecendo niveis
            dexenerados, segundo os valores dosoutros números cuánticos ($m_l$ e $m_s$).
            Ao considerar interaccións máis débiles, como a interacción residual de
            Coulomb ou a interacción espín-órbita, que afectan aos electróns en niveis
            excitados, aparecen acoplamentos entre os momentos angulares de rotación
            ($S$) e de translación ($L$), condicionándose os valores destas magnitudes
            para o conxunto, e dando lugar a desdoblamentos enerxéticos característicos
            nestes sistemas. Son exemplos de acoplamentos a este nivel: o acomplamento
            de Russell-Saunders, o acoplamento JJ e o acoplamento espín-órbita.'
