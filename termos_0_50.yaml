            de partículas cargadas electricamente. Empréganse para bombardear núcleos
            atómicos ou provocar colisións entre partículas subatómicas e estudiar
            a súa estructura e interaccións entre as mesmas. Existen diferentes tipos
            de aceleradores: os electrostáticos, como o de Cockroft e Walton, ou o
            de Van der Graaf, os aceleradores lineais, o betatrón, o ciclotrón e o
            sincrotrón. As partículas resultantes das colisións son detectadas, e
            rexistradas as súas traxectorias, en cámaras de burbullas, cámaras de
