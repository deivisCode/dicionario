          definicion: Magnitude física empregada na mecánica introducida por P.L.
            Maupertius (1698-1759) que expresa, en termos actuais, o producto do momento
            lineal dun móbil polo seu desprazamento, $S = m v d$. Tal expresión resulta
            equivalente ao producto dunha enerxía por un tempo, empregándose na mecánica
            analítica, para expresar a acción dun sistema, con enerxía cinética $T$
            e nun campo conservativo de enerxía potencial $U$, a ecuación $ S = integral_(t_1)^(t_2)
            (T - U) d t $ No SI exprésase en J·s. A constante de Planck, $planck$,
            de emprego xeneralizado na mecánica cuántica, é un exemplo de acción.
