- termo: actividade óptica
  acepcions:
    - lingua:
        gl:
          termo: actividade óptica
          definicion: Propiedade que posúen algunhas substancias de desviar o plano
            de polarización da luz cara á dereita (dextróxiras) ou cara á esquerda
            (levóxiras). A actividade óptica dun composto pode resultar de interese
            para a súa identificación e adquiere especial importancia en bioquímica,
            farmacoloxía, e outras ciencias da vida, dado o sensible que resultan
            os seres vivos a diferentes isómeros ópticos. En xeral os aminoácidos
            que forman parte das proteínas dos seres vivos son levóxiros e moitos
            monosacáridos dextróxiros.
